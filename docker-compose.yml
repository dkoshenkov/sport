services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sport
      POSTGRES_USER: sport
      POSTGRES_PASSWORD: sport
    ports:
      - "${POSTGRES_PORT:-35432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sport -d sport"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: api
    environment:
      ENV: dev
      SERVICE_NAME: sport-api
      SPORT_API_ADDR: :8080
      EXERCISE_DATASET_DIR: /app/exercises-dataset-main
      DATABASE_URL: postgres://sport:sport@postgres:5432/sport?sslmode=disable
      DATABASE_RUN_MIGRATIONS: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: ${LOG_PRETTY:-false}
      HTTP_REQUEST_ID_HEADER: X-Request-ID
      HTTP_TIMEOUT: 30s
      HTTP_LOG_REQUESTS: "true"
    ports:
      - "${API_PORT:-38080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "${CLIENT_PORT:-38174}:80"
    volumes:
      - ./exercises-dataset-main/videos:/usr/share/nginx/html/videos:ro
    depends_on:
      - api

volumes:
  postgres-data:
